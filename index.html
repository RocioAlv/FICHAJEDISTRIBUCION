<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adherencia al Fichaje</title>
<style>
  :root{
    --navy:#083A4F;
    --gold:#A58D66;
    --aqua:#C0D5D6;
    --teal:#407E8C;
    --sand:#E5E1DD;
    --ausente:#AD4A3D;
    --incompleto:#C79A4B;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--sand);
    color:var(--navy);
  }
  header{
    background:var(--navy);
    color:var(--sand);
    padding:28px 24px 20px;
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.6rem;
    letter-spacing:.3px;
  }
  header p{
    margin:0;
    color:var(--aqua);
    font-size:.95rem;
  }
  .tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:18px auto 0;
    max-width:520px;
    padding:0 16px;
  }
  .tab-btn{
    flex:1;
    padding:10px 12px;
    border:2px solid var(--navy);
    background:var(--white);
    color:var(--navy);
    border-radius:10px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn.active{
    background:var(--navy);
    color:var(--sand);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .card{
    background:var(--white);
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(8,58,79,.08);
  }
  label{
    display:block;
    font-size:.82rem;
    font-weight:600;
    color:var(--teal);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  select, input[type=text]{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--aqua);
    border-radius:8px;
    font-size:1rem;
    color:var(--navy);
    background:var(--sand);
  }
  .row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .row > div{flex:1;min-width:150px;}
  .stat-block{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:16px;
  }
  .ring{
    width:96px;height:96px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-weight:700;
    font-size:1.15rem;
    color:var(--navy);
    background:conic-gradient(var(--teal) calc(var(--pct,0)*1%), var(--aqua) 0);
    position:relative;
  }
  .ring::before{
    content:'';
    position:absolute;
    width:72px;height:72px;
    border-radius:50%;
    background:var(--white);
  }
  .ring span{position:relative;}
  .stat-text .num{font-size:1.4rem;font-weight:700;color:var(--navy);}
  .stat-text .lbl{font-size:.85rem;color:var(--teal);}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin:14px 0 4px;
    font-size:.8rem;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .mini-stats{
    display:flex;
    gap:10px;
    margin:16px 0 4px;
  }
  .mini-stat{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    background:var(--sand);
  }
  .mini-stat .n{font-size:1.25rem;font-weight:700;}
  .mini-stat .t{font-size:.75rem;color:var(--teal);margin-top:2px;}
  .mini-stat.completo .n{color:var(--teal);}
  .mini-stat.incompleto .n{color:var(--incompleto);}
  .mini-stat.ausente .n{color:var(--ausente);}
  .day-list{margin-top:10px;}
  .day-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 6px;
    border-bottom:1px solid var(--sand);
    font-size:.9rem;
  }
  .day-row:last-child{border-bottom:none;}
  .day-left{display:flex;align-items:center;gap:10px;}
  .status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .horas{color:var(--teal);font-variant-numeric:tabular-nums;font-size:.85rem;}
  .status-completo{background:var(--teal);}
  .status-incompleto{background:var(--incompleto);}
  .status-ausente{background:var(--ausente);}
  .status-libre{background:var(--aqua);}
  table{width:100%;border-collapse:collapse;font-size:.92rem;}
  th, td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sand);}
  th{color:var(--teal);text-transform:uppercase;font-size:.75rem;letter-spacing:.4px;}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:20px;
    font-size:.78rem;font-weight:700;color:var(--white);
  }
  .empty{
    text-align:center;color:var(--teal);padding:30px 10px;font-size:.92rem;
  }
  .hidden{display:none;}
  footer{
    text-align:center;color:var(--teal);font-size:.75rem;padding:10px 16px 30px;
  }
</style>
</head>
<body>

<header>
  <h1>Adherencia al Fichaje</h1>
  <p>Camioneros · consultá tu estado de fichaje o el compilado del área</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="individual">Mi fichaje</button>
  <button class="tab-btn" data-tab="general">Vista general</button>
</div>

<main>

  <!-- VISTA INDIVIDUAL -->
  <section id="tab-individual">
    <div class="card">
      <div class="row">
        <div>
          <label for="areaSelect">Área</label>
          <select id="areaSelect"></select>
        </div>
        <div>
          <label for="mesSelect">Mes</label>
          <select id="mesSelect"></select>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div>
          <label for="nombreInput">Nombre y apellido</label>
          <input list="listaNombres" id="nombreInput" type="text" placeholder="Elegí tu área y escribí tu nombre...">
          <datalist id="listaNombres"></datalist>
        </div>
      </div>
    </div>

    <div class="card" id="resumenCard">
      <div class="empty" id="individualEmpty">Elegí tu nombre para ver tu adherencia.</div>
      <div id="individualContent" class="hidden">
        <div class="stat-block">
          <div class="ring" id="ringPct" style="--pct:0"><span id="ringPctText">0%</span></div>
          <div class="stat-text">
            <div class="num" id="diasCompletos">0 / 0</div>
            <div class="lbl">días con fichaje completo sobre días hábiles del mes</div>
          </div>
        </div>
        <div class="mini-stats" id="miniStats"></div>
        <div class="day-list" id="dayList"></div>
      </div>
    </div>
  </section>

  <!-- VISTA GENERAL -->
  <section id="tab-general" class="hidden">
    <div class="card">
      <label for="mesSelectGeneral">Mes</label>
      <select id="mesSelectGeneral"></select>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr><th>Área</th><th>Empleados</th><th>Adherencia</th></tr>
        </thead>
        <tbody id="areaTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<footer>Los datos se actualizan automáticamente desde la planilla de fichajes.<br><span id="fuenteDatos"></span></footer>

  '2026-01-01','2026-02-16','2026-02-17','2026-03-23','2026-03-24',

let FUENTE = 'demo';
let fichajesCache = {}; // mes (YYYY-MM) -> array de fichajes de ese mes, ya sea de la API o del demo

/* Mapeo manual de área por si el campo AREA del export no está
   cargado para todos los empleados. Cada entrada es un nombre (o
   nombre+apellido, en cualquier orden) que debe estar CONTENIDO en
   el nombre completo del empleado para asignarle esa área. Si un
   nombre no aparece acá, se usa el área que ya trae desde la planilla. */
const AREA_OVERRIDES = {
  'DISTRIBUCION': ['ludueña','acosta','riquelme','verdera','cabral','russo','distefano','mendez','segovia','saavedra','bellesi mauricio','torres'],
  'ACARREO': ['randazzo'],
  'ADMINISTRACION': ['micaela pasini','martin milagros','walter herrera','rocio alvarez','ricci mara'],
  'VENTAS': ['feraboli damian','valiente guadalupe','arrieta','rocca','bellesi andrea','pereyra','rodriguez','vittorio'],
  'ALMACENES': ['heredia','cappiello','schnap','catalan']
};

function normalizar_(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function areaDeEmpleado(nombre){
  const tokens = normalizar_(nombre).split(/\s+/);
  for (const area in AREA_OVERRIDES){
    for (const entrada of AREA_OVERRIDES[area]){
      const entTokens = normalizar_(entrada).split(/\s+/);
      if (entTokens.every(t => tokens.includes(t))) return area;
    }
  }
  return null; // sin match -> se usa el área original de la planilla
}

function aplicarOverridesDeArea(){
  DATA.empleados.forEach(e => {
    const area = areaDeEmpleado(e.nombre);
    if (area) e.area = area;
  });
}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

async function fetchJSON_(url){
  const res = await fetch(url);
  return res.json();
}

/* Carga liviana: solo empleados + meses disponibles + feriados.
   NO trae los fichajes todavía — esos se piden mes por mes. */
async function cargarDatos(){
  if (APPS_SCRIPT_URL) {
    try {
      const meta = await fetchJSON_(APPS_SCRIPT_URL);
      if (!meta.error) {
        DATA.empleados = meta.empleados || [];
        DATA.meses = meta.meses || [];
        DATA.feriados = (meta.feriados && meta.feriados.length) ? meta.feriados : FERIADOS_DEFAULT;
        FUENTE = 'conectado';
        aplicarOverridesDeArea();
        return init();
      }
    } catch (err) {
      console.warn('No se pudo conectar al Apps Script, muestro datos de ejemplo.', err);
    }
  }
  // ---- Fallback demo (todo local, sin fetch) ----
  DATA.empleados = DEMO_DATA.empleados;
  DATA.feriados = FERIADOS_DEFAULT;
  fichajesCache = {};
  DEMO_DATA.fichajes.forEach(f => {
    const m = f.fecha.slice(0,7);
    if (!fichajesCache[m]) fichajesCache[m] = [];
    fichajesCache[m].push(f);
  });
  DATA.meses = Object.keys(fichajesCache).sort();
  FUENTE = 'demo';
  aplicarOverridesDeArea();
  init();
}

/* Trae los fichajes de un mes puntual — de la caché local si ya se
   pidió antes, o del Apps Script (que a su vez cachea 15 minutos). */
async function obtenerFichajesDeMes(mes){
  if (fichajesCache[mes]) return fichajesCache[mes];
  if (FUENTE !== 'conectado') return [];
  try {
    const json = await fetchJSON_(APPS_SCRIPT_URL + '?mes=' + encodeURIComponent(mes));
    const arr = (json && json.fichajes) ? json.fichajes : [];
    fichajesCache[mes] = arr;
    return arr;
  } catch (err) {
    console.warn('No se pudo cargar el mes', mes, err);
    return [];
  }
}

function poblarSelects(){
  const meses = DATA.meses.slice().sort();
  const opciones = meses.map(m => {
    const [y, mm] = m.split('-');
    return `<option value="${m}">${MESES[parseInt(mm,10)-1]} ${y}</option>`;
  }).join('');
  document.getElementById('mesSelect').innerHTML = opciones;
  document.getElementById('mesSelectGeneral').innerHTML = opciones;
  if (meses.length){
    document.getElementById('mesSelect').value = meses[meses.length-1];
    document.getElementById('mesSelectGeneral').value = meses[meses.length-1];
  }

  const areas = Array.from(new Set(DATA.empleados.map(e => e.area).filter(Boolean))).sort();
  document.getElementById('areaSelect').innerHTML =
    '<option value="">Elegí un área...</option>' +
    areas.map(a => `<option value="${a}">${a}</option>`).join('');

  poblarNombresPorArea();

  const fuenteEl = document.getElementById('fuenteDatos');
  fuenteEl.textContent = FUENTE === 'conectado'
    ? '🟢 Datos conectados en vivo a la planilla.'
    : '🟡 Mostrando datos de ejemplo (no se pudo conectar a la planilla todavía).';
}

function poblarNombresPorArea(){
  const area = document.getElementById('areaSelect').value;
  const datalist = document.getElementById('listaNombres');
  const lista = DATA.empleados
    .filter(e => !area || e.area === area)
    .slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  datalist.innerHTML = lista.map(e => `<option value="${e.nombre}">`).join('');
  document.getElementById('nombreInput').placeholder = area
    ? 'Escribí tu nombre...'
    : 'Elegí tu área y escribí tu nombre...';
}

function esLaborable(fechaStr){
  const d = new Date(fechaStr + 'T00:00:00');
  const dow = d.getDay(); // 0=domingo
  if (dow === 0) return false;
  if (DATA.feriados.includes(fechaStr)) return false;
  return true;
}

function diasDelMes(mes){
  const [y, m] = mes.split('-').map(Number);
  const ultimo = new Date(y, m, 0).getDate();
  const out = [];
  for (let d=1; d<=ultimo; d++){
    out.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return out;
}

function estadoDelDia(fecha, nombre, fichajesMes){
  if (!esLaborable(fecha)) return 'libre';
  const reg = fichajesMes.find(f => f.fecha === fecha && f.nombre === nombre);
  if (!reg) return 'ausente';
  if (reg.entrada && reg.salida) return 'completo';
  if (reg.entrada || reg.salida) return 'incompleto';
  return 'ausente';
}

async function renderIndividual(){
  const area = document.getElementById('areaSelect').value;
  const nombre = document.getElementById('nombreInput').value.trim();
  const mes = document.getElementById('mesSelect').value;
  const empty = document.getElementById('individualEmpty');
  const content = document.getElementById('individualContent');

  if (!area){
    empty.classList.remove('hidden');
    content.classList.add('hidden');
    empty.textContent = 'Elegí primero tu área.';
    return;
  }

  const existe = DATA.empleados.some(e => e.nombre.toLowerCase() === nombre.toLowerCase() && e.area === area);
  if (!nombre || !existe || !mes){
    empty.classList.remove('hidden');
    content.classList.add('hidden');
    if (nombre && !existe){
      empty.textContent = 'No encontramos ese nombre en esa área. Revisá cómo está escrito.';
    } else {
      empty.textContent = 'Elegí tu nombre para ver tu adherencia.';
    }
    return;
  }

  empty.classList.remove('hidden');
  empty.textContent = 'Cargando...';
  content.classList.add('hidden');

  const fichajesMes = await obtenerFichajesDeMes(mes);

  // por si cambiaron de nombre/mes mientras cargaba, revalidamos antes de pintar
  if (document.getElementById('mesSelect').value !== mes || document.getElementById('nombreInput').value.trim() !== nombre) return;

  empty.classList.add('hidden');
  content.classList.remove('hidden');

  const nombreReal = DATA.empleados.find(e => e.nombre.toLowerCase() === nombre.toLowerCase() && e.area === area).nombre;
  const dias = diasDelMes(mes);
  const habiles = dias.filter(esLaborable);
  let completos = 0, incompletos = 0, noFicho = 0;

  const ETIQUETAS = { completo: 'Completo', incompleto: 'Incompleto', ausente: 'No fichó' };

  const filas = habiles.map(fecha => {
    const estado = estadoDelDia(fecha, nombreReal, fichajesMes);
    if (estado === 'completo') completos++;
    else if (estado === 'incompleto') incompletos++;
    else if (estado === 'ausente') noFicho++;
    const reg = fichajesMes.find(f => f.fecha === fecha && f.nombre === nombreReal);
    const horas = reg ? `${reg.entrada || '--:--'} · ${reg.salida || '--:--'}` : '';
    const d = new Date(fecha + 'T00:00:00');
    const diaTxt = d.toLocaleDateString('es-AR', { weekday:'short', day:'numeric' });
    return `<div class="day-row">
      <div class="day-left">
        <span class="status-dot status-${estado}"></span>
        <span>${diaTxt}</span>
        <span class="horas" style="margin-left:6px;color:var(--navy);opacity:.6">${ETIQUETAS[estado]}</span>
      </div>
      <span class="horas">${horas}</span>
    </div>`;
  }).join('');

  document.getElementById('dayList').innerHTML = filas;
  document.getElementById('miniStats').innerHTML = `
    <div class="mini-stat completo"><div class="n">${completos}</div><div class="t">Completos</div></div>
    <div class="mini-stat incompleto"><div class="n">${incompletos}</div><div class="t">Incompletos</div></div>
    <div class="mini-stat ausente"><div class="n">${noFicho}</div><div class="t">No fichó</div></div>
  `;

  const pct = habiles.length ? Math.round((completos/habiles.length)*100) : 0;
  document.getElementById('ringPct').style.setProperty('--pct', pct);
  document.getElementById('ringPctText').textContent = pct + '%';
  document.getElementById('diasCompletos').textContent = `${completos} / ${habiles.length}`;
}

async function renderGeneral(){
  const mes = document.getElementById('mesSelectGeneral').value;
  if (!mes) return;

  const tbody = document.getElementById('areaTableBody');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--teal);padding:20px">Cargando...</td></tr>';

  const fichajesMes = await obtenerFichajesDeMes(mes);
  if (document.getElementById('mesSelectGeneral').value !== mes) return; // cambiaron el mes mientras cargaba

  const dias = diasDelMes(mes);
  const habiles = dias.filter(esLaborable);

  const porArea = {};
  DATA.empleados.forEach(e => {
    if (!porArea[e.area]) porArea[e.area] = { empleados: 0, sumaPct: 0 };
    porArea[e.area].empleados++;
    const completos = habiles.filter(f => estadoDelDia(f, e.nombre, fichajesMes) === 'completo').length;
    const pct = habiles.length ? (completos/habiles.length)*100 : 0;
    porArea[e.area].sumaPct += pct;
  });

  const filas = Object.keys(porArea).sort().map(area => {
    const info = porArea[area];
    const prom = Math.round(info.sumaPct / info.empleados);
    const color = prom >= 85 ? 'var(--teal)' : (prom >= 60 ? 'var(--incompleto)' : 'var(--ausente)');
    return `<tr>
      <td>${area}</td>
      <td>${info.empleados}</td>
      <td><span class="pill" style="background:${color}">${prom}%</span></td>
    </tr>`;
  }).join('');

  tbody.innerHTML = filas || '<tr><td colspan="3">Sin datos</td></tr>';
}

function initTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-individual').classList.toggle('hidden', btn.dataset.tab !== 'individual');
      document.getElementById('tab-general').classList.toggle('hidden', btn.dataset.tab !== 'general');
    });
  });
}

function init(){
  poblarSelects();
  initTabs();
  document.getElementById('areaSelect').addEventListener('change', () => {
    document.getElementById('nombreInput').value = '';
    poblarNombresPorArea();
    renderIndividual();
  });
  document.getElementById('nombreInput').addEventListener('input', renderIndividual);
  document.getElementById('mesSelect').addEventListener('change', renderIndividual);
  document.getElementById('mesSelectGeneral').addEventListener('change', renderGeneral);
  renderIndividual();
  renderGeneral();
}

cargarDatos();
</script>
